[package]
name = "jsonviewer"
version = "1.0.0"
edition = "2021"
description = "JSON Viewer and Formatter for Linux - native Wayland/X11 port of the macOS app"
default-run = "jsonviewer"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
eframe = { version = "0.32", default-features = true }
egui = "0.32"
rfd = "0.15"
arboard = "3"

[[bin]]
name = "jsonviewer"
path = "src/main.rs"

[profile.release]
lto = true
strip = true
